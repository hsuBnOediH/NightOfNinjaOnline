services:
  - type: web
    name: night-of-ninja-online
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true
      # Render's default GUNICORN_CMD_ARGS includes --preload, which imports
      # Flask before the eventlet worker monkey-patches. Keep only access logs.
      - key: GUNICORN_CMD_ARGS
        value: "--access-logfile -"
